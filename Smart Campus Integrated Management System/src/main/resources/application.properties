spring.application.name=scims-activities
server.port=8080

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/smart_campus_db}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.sql.init.mode=never

# The secret must be shared with the existing authentication provider. No insecure default is supplied.
scims.security.jwt.secret=${SCIMS_JWT_SECRET}
